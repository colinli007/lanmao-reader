name: blocking_bridge
description: "工作 isolate 池：任务在后台 isolate 里同步执行，可同步等待主 isolate 的异步宿主请求，支持截止时间、取消和故障恢复。"
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  ffi: ^2.1.3
  native_synchronization:
    path: ../native_synchronization

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

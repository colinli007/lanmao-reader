# Run with `dart run ffigen --config ffigen.yaml`.
name: QuickjsNgFfiBindings
functions:
  include:
    - 'qjs_.*'
description: |
  Bindings for `src/quickjs_ng_ffi.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/quickjs_ng_ffi_bindings_generated.dart'
headers:
  entry-points:
    - 'src/quickjs_ng_ffi.h'
  include-directives:
    - 'src/quickjs_ng_ffi.h'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full

name: spike
description: "验证：后台 isolate 里的 QuickJS 同步等待主 isolate 的异步结果。"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  quickjs_ng_ffi:
    path: ../packages/quickjs_ng_ffi
  blocking_bridge:
    path: ../packages/blocking_bridge
  rule_engine:
    path: ../packages/rule_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # 排版验证的真实网文 assets/corpus.txt 不进仓库（见 assets/README.md），声明成目录，缺这个文件时不影响构建
  assets:
    - assets/

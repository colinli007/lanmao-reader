name: novel_reader
description: "跨端开源小说阅读器，兼容 Legado 书源（社区版）。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  blocking_bridge:
    path: ../packages/blocking_bridge
  rule_engine:
    path: ../packages/rule_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1
  file_selector_platform_interface: ^2.7.0
  plugin_platform_interface: ^2.1.8
  vm_service: ^15.0.0
  ffi: ^2.1.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# app 图标：源文件和渲染命令见 design/README.md；改了图之后运行 dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: ../design/app-icon.png
  android: true
  adaptive_icon_background: "#2F5D50"
  adaptive_icon_foreground: ../design/app-icon-foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: ../design/app-icon-macos.png
